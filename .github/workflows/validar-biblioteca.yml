name: Validar biblioteca documental

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar validador de PDF
        run: python -m pip install --upgrade pypdf
      - name: Comprobar sintaxis de JavaScript
        run: node --check web/biblioteca.js
      - name: Validar catálogo, archivos y portadas
        run: python3 scripts/validar_biblioteca.py
