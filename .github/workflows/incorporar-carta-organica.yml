name: Incorporar documento normativo oficial

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/incorporar-carta-organica.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  incorporar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar original oficial
        uses: actions/checkout@v4

      - name: Recuperar y verificar el PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p documentos
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://boficial.neuquen.gov.ar/Boletines/bo04021302862a.pdf" \
            --output "documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf"
          test "$(head -c 5 documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf)" = "%PDF-"
          test "$(stat -c%s documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf)" -gt 20000
          pdfinfo documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf | grep -E "Pages:|Page size:|PDF version:"
          sha256sum documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf

      - name: Incorporar el documento al catálogo público
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          file = Path("documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf")
          digest = hashlib.sha256(file.read_bytes()).hexdigest()
          catalog_path = Path("catalogo.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          catalog["documentos"] = [d for d in catalog.get("documentos", []) if d.get("id") != "carta-organica-2004"]
          catalog["documentos"].append({
              "id": "carta-organica-2004",
              "titulo": "Carta Orgánica Municipal de San Patricio del Chañar",
              "autoria": "Convención Municipal de San Patricio del Chañar",
              "institucion": "Convención Municipal de San Patricio del Chañar",
              "fecha": "2004",
              "categoria": "Historia y memoria",
              "tematica": "Organización municipal, autonomía, derechos, territorio e identidad local",
              "descripcion": "Texto normativo oficial sancionado por la Convención Municipal y publicado como anexo del Boletín Oficial de la Provincia del Neuquén, edición 2862, del 13 de febrero de 2004. Copia PDF íntegra de la publicación oficial.",
              "formato": "PDF",
              "archivo": str(file),
              "estado": "Publicado",
              "autorizacion": {
                  "estado": "confirmada",
                  "base": "Texto normativo oficial. La base documental oficial de InfoLEG clasifica leyes, decretos, ordenanzas y otros textos oficiales como datos no protegidos por derecho de autor.",
                  "referencia": "InfoLEG, Base de Datos, apartado sobre datos no protegidos; Boletín Oficial de Neuquén, edición 2862."
              },
              "procedencia": "Boletín Oficial de la Provincia del Neuquén, Anexo, edición 2862, 13-02-2004.",
              "integridad": "Copia binaria descargada de la publicación oficial; SHA-256 verificado en el flujo de incorporación.",
              "sha256": digest
          })
          catalog["documentos"].sort(key=lambda d: d.get("titulo", "").casefold())
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Guardar archivo y catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add documentos/Carta-Organica-Municipal-San-Patricio-del-Chanar-2004.pdf catalogo.json
          git commit -m "Incorporar Carta Orgánica Municipal 2004"
          git push
